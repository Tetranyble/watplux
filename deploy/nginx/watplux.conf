# Reference reverse-proxy fragment. TLS certificate automation is platform-specific.
# The critical security rule is that Nginx OVERWRITES X-Real-IP; Watplux must
# never trust a client-supplied value for rate limiting.
upstream watplux_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name shop.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shop.example.com;

    # ssl_certificate /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;

    client_max_body_size 12m;

    location / {
        proxy_pass http://watplux_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
