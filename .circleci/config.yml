version: 2.1

# Watplux release-candidate CI.
#
# CircleCI intentionally validates the same release contract used locally:
# lockfile -> dependencies -> schema -> migrations -> source audits -> tests ->
# browser journeys -> production build.
#
# Test-only secrets below are deliberately non-production values. Never add
# real Paystack, Better Auth, S3, database, or worker credentials to this file.

executors:
  watplux_node:
    docker:
      - image: node:22.23.1-bookworm
      - image: mysql:8.0
        environment:
          MYSQL_DATABASE: watplux
          MYSQL_USER: watplux
          MYSQL_PASSWORD: watplux
          MYSQL_ROOT_PASSWORD: watplux_root
    working_directory: ~/watplux
    environment:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: mysql://watplux:watplux@127.0.0.1:3306/watplux
      DEPLOYMENT_ENV: test
      LOG_LEVEL: silent
      BETTER_AUTH_SECRET: circleci-only-better-auth-secret-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      APP_BASE_URL: http://127.0.0.1:3000
      GUEST_ORDER_TOKEN_SECRET: circleci-only-guest-order-token-secret-32chars
      INTERNAL_WORKER_SECRET: circleci-only-internal-worker-secret-32chars
      MEDIA_STORAGE_PROVIDER: local

commands:
  restore_npm_cache:
    steps:
      - restore_cache:
          keys:
            - watplux-npm-v1-{{ checksum "package-lock.json" }}
            - watplux-npm-v1-

  save_npm_cache:
    steps:
      - save_cache:
          key: watplux-npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

  wait_for_mysql:
    steps:
      - run:
          name: Wait for MySQL
          command: |
            node <<'NODE'
            const net = require("node:net");
            const deadline = Date.now() + 60_000;

            function probe() {
              const socket = net.createConnection({ host: "127.0.0.1", port: 3306 });
              socket.once("connect", () => {
                socket.destroy();
                console.log("MySQL is accepting connections.");
              });
              socket.once("error", () => {
                socket.destroy();
                if (Date.now() >= deadline) {
                  console.error("MySQL did not become ready within 60 seconds.");
                  process.exit(1);
                }
                setTimeout(probe, 1_000);
              });
            }

            probe();
            NODE

jobs:
  release_gate:
    executor: watplux_node
    resource_class: medium
    steps:
      - checkout

      - run:
          name: Verify runtime versions
          command: |
            node --version
            npm --version
            test "$(node -p 'process.versions.node')" = "$(cat .nvmrc)"

      - run:
          name: Verify package lock is synchronized
          command: npm run audit:lockfile

      - restore_npm_cache

      - run:
          name: Install locked dependencies
          command: npm ci --prefer-offline --no-audit
          no_output_timeout: 15m

      - save_npm_cache
      - wait_for_mysql

      - run:
          name: Generate Prisma client
          command: npm run db:generate

      - run:
          name: Apply migrations to disposable CI database
          command: npm run db:migrate:deploy

      - run:
          name: Install Chromium and Linux browser dependencies
          command: npx playwright install --with-deps chromium
          no_output_timeout: 15m

      - run:
          name: Run Watplux release gate
          command: npm run release:gate
          no_output_timeout: 30m

      - store_artifacts:
          path: playwright-report
          destination: playwright-report

      - store_artifacts:
          path: test-results
          destination: test-results

workflows:
  validate:
    jobs:
      - release_gate:
          filters:
            tags:
              only: /^v.*/
